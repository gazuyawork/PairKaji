name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Test web application
        run: |
          npm run lint
          npm test
          npx tsc --noEmit

      - name: Build web application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: pairkaji-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: pairkaji-ci.invalid
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci

      - name: Verify Functions
        working-directory: functions
        run: |
          npm run lint
          npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Generate Android plugin files
        run: |
          mkdir -p out
          touch out/index.html
          mkdir -p android/capacitor-cordova-android-plugins
          mkdir -p android/app/src/main/assets
          tar -xzf node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz \
            -C android/capacitor-cordova-android-plugins
          npx cap update android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Run Android unit tests
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew test --stacktrace --console=plain 2>&1 | tee gradle-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -i "FAILURE:|What went wrong|Could not|error:|Caused by:|Exception|requires|failed" gradle-test.log \
              | tail -n 40 \
              | while IFS= read -r line; do
              echo "::error title=Android unit tests::$line"
            done
          fi
          exit "$status"
